name: Release ISSH Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Build & sign Tauri Windows installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'ISSH ${{ github.ref_name }}'
          releaseBody: |
            ## ISSH ${{ github.ref_name }}

            - 已发布新版本，点击更新即可获取最新功能与体验优化。
          releaseDraft: false
          prerelease: false

  publish-android:
    needs: publish-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Initialize & build Android APK (Tauri 2.0 Mobile)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          export NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME"
          npx tauri android init --ci

          # 0. Force strictly monotonic Android versionCode (2000000 + major*1000000 + minor*1000 + patch)
          #    so Android never thinks 0.1.9 > 0.1.11!
          TAG_CLEAN="${GITHUB_REF_NAME#v}"
          IFS='.' read -r V_MAJ V_MIN V_PAT <<< "$TAG_CLEAN"
          V_MAJ="${V_MAJ:-0}"; V_MIN="${V_MIN:-1}"; V_PAT="${V_PAT:-0}"
          V_CODE=$(( 2000000 + V_MAJ * 1000000 + V_MIN * 1000 + V_PAT ))
          echo "Setting Android versionName=$TAG_CLEAN versionCode=$V_CODE"
          node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.android=Object.assign({},c.bundle.android,{versionCode:$V_CODE});fs.writeFileSync(p,JSON.stringify(c,null,2));"
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          tauri.android.versionName=$TAG_CLEAN
          tauri.android.versionCode=$V_CODE
          EOF

          # 1. Apply our real ISSH dark ">_" PC icon to all Android mipmap densities
          npx tauri icon src-tauri/icons/icon.png
          if [ -d "src-tauri/icons/android" ]; then
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          cat > src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0C1018</color>
          </resources>
          EOF

          # 2. Prevent Android 15 edge-to-edge from overlapping the top status bar & camera notch
          cat > src-tauri/gen/android/app/src/main/res/values/themes.xml <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.issh_desktop" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0B0F17</item>
                  <item name="android:navigationBarColor">#101622</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement" tools:targetApi="35">true</item>
              </style>
          </resources>
          EOF

          # 3. Enable REQUEST_INSTALL_PACKAGES + FileProvider cache-path for Android in-app one-click APK update
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' "$MANIFEST"
          fi
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          cat > src-tauri/gen/android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="apk_updates" path="." />
              <files-path name="app_files" path="." />
              <external-path name="external_files" path="." />
          </paths>
          EOF

          # 4. Patch MainActivity.kt:
          #    - Native WindowInsets padding so nothing ever overlaps the top status bar
          #    - ISSHAndroidUpdater JS bridge for in-app APK download with live progress + native installer
          MAIN_ACT=$(find src-tauri/gen/android/app/src/main/java -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_ACT")
            printf '%s\n\n' "$PKG_LINE" > "$MAIN_ACT"
            cat >> "$MAIN_ACT" <<'EOF'
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.core.content.FileProvider
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : TauriActivity() {
            private var appWebView: WebView? = null
            private var lastBackPressedAt: Long = 0L

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              WindowCompat.setDecorFitsSystemWindows(window, true)
              window.statusBarColor = Color.parseColor("#0B0F17")
              window.navigationBarColor = Color.parseColor("#101622")
              val rootView = findViewById<View>(android.R.id.content)
              rootView.setBackgroundColor(Color.parseColor("#0B0F17"))
              ViewCompat.setOnApplyWindowInsetsListener(rootView) { v, windowInsets ->
                val insets = windowInsets.getInsets(
                  WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout() or WindowInsetsCompat.Type.ime()
                )
                v.setPadding(insets.left, insets.top, insets.right, insets.bottom)
                WindowInsetsCompat.CONSUMED
              }

              onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                override fun handleOnBackPressed() {
                  val wv = appWebView
                  if (wv == null) {
                    finish()
                    return
                  }
                  wv.evaluateJavascript("window.__isshHandleBack ? window.__isshHandleBack() : false") { result ->
                    if (result == "true") return@evaluateJavascript
                    val now = System.currentTimeMillis()
                    if (now - lastBackPressedAt < 2000L) {
                      moveTaskToBack(true)
                    } else {
                      lastBackPressedAt = now
                      Toast.makeText(this@MainActivity, "再按一次返回键退出 ISSH", Toast.LENGTH_SHORT).show()
                    }
                  }
                }
              })
            }

            override fun onWebViewCreate(webView: WebView) {
              super.onWebViewCreate(webView)
              appWebView = webView
              webView.addJavascriptInterface(AndroidUpdaterBridge(this, webView), "ISSHAndroidUpdater")
            }

            private class AndroidUpdaterBridge(
              private val activity: MainActivity,
              private val webView: WebView
            ) {
              private fun emitProgress(pct: Int, phase: String) {
                activity.runOnUiThread {
                  webView.evaluateJavascript(
                    "window.__isshAndroidUpdateProgress && window.__isshAndroidUpdateProgress($pct, '$phase');",
                    null
                  )
                }
              }

              private fun emitError(msg: String) {
                val safe = JSONObject.quote(msg)
                activity.runOnUiThread {
                  webView.evaluateJavascript(
                    "window.__isshAndroidUpdateError && window.__isshAndroidUpdateError($safe);",
                    null
                  )
                }
              }

              @JavascriptInterface
              fun downloadAndInstall(apkUrl: String) {
                Thread {
                  try {
                    emitProgress(0, "downloading")
                    var currentUrl = apkUrl
                    var conn: HttpURLConnection? = null
                    for (hop in 0..5) {
                      val c = (URL(currentUrl).openConnection() as HttpURLConnection).apply {
                        instanceFollowRedirects = true
                        connectTimeout = 20000
                        readTimeout = 60000
                        setRequestProperty("User-Agent", "ISSH-Android-Updater")
                      }
                      val code = c.responseCode
                      if (code in 301..308) {
                        val loc = c.getHeaderField("Location")
                        c.disconnect()
                        if (loc.isNullOrBlank()) break
                        currentUrl = URL(URL(currentUrl), loc).toString()
                        continue
                      }
                      conn = c
                      break
                    }
                    val activeConn = conn ?: throw RuntimeException("无法连接到下载服务器")
                    if (activeConn.responseCode !in 200..299) {
                      val code = activeConn.responseCode
                      activeConn.disconnect()
                      throw RuntimeException("下载失败 (HTTP $code)")
                    }
                    val total = activeConn.contentLengthLong
                    val outFile = File(activity.cacheDir, "issh-update.apk")
                    activeConn.inputStream.use { input ->
                      FileOutputStream(outFile).use { output ->
                        val buf = ByteArray(16 * 1024)
                        var downloaded = 0L
                        var lastPct = -1
                        while (true) {
                          val n = input.read(buf)
                          if (n <= 0) break
                          output.write(buf, 0, n)
                          downloaded += n
                          val pct = if (total > 0) ((downloaded * 100L) / total).toInt().coerceIn(0, 99) else 50
                          if (pct != lastPct) {
                            lastPct = pct
                            emitProgress(pct, "downloading")
                          }
                        }
                      }
                    }
                    activeConn.disconnect()

                    emitProgress(100, "installing")
                    val uri = FileProvider.getUriForFile(
                      activity,
                      "${activity.packageName}.fileprovider",
                      outFile
                    )
                    val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    }
                    activity.runOnUiThread {
                      activity.startActivity(intent)
                    }
                  } catch (e: Exception) {
                    emitError(e.message ?: "下载或调起安装失败")
                  }
                }.start()
              }
            }
          }
          EOF
            echo "Patched $MAIN_ACT with native WindowInsets + ISSHAndroidUpdater bridge"
          fi

          npx tauri android build --apk --target aarch64

      - name: Sign & Upload Android APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APK_RAW=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)

          KS_PATH="/tmp/issh-release.keystore"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-issh-android-sign-2026}"
          KS_ALIAS="${ANDROID_KEY_ALIAS:-issh}"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$KS_PATH" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ISSH, OU=Mobile, O=ISSH, L=Shanghai, S=Shanghai, C=CN"
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_RAW" "/tmp/issh-aligned.apk"
          OUT_APK="ISSH_${GITHUB_REF_NAME}_android_arm64.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_PASS" \
            --out "$OUT_APK" \
            "/tmp/issh-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT_APK"

          gh release upload "${GITHUB_REF_NAME}" "$OUT_APK" --clobber

name: Release ISSH Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Build & sign Tauri Windows installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'ISSH ${{ github.ref_name }}'
          releaseBody: |
            ## ISSH ${{ github.ref_name }}

            - Windows 安装包（`.exe` / `.msi`）支持客户端内一键自动更新。
            - 详见提交记录。
          releaseDraft: false
          prerelease: false

  publish-android:
    needs: publish-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Initialize & build Android APK (Tauri 2.0 Mobile)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          export NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Sign & Upload Android APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APK_RAW=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)

          KS_PATH="/tmp/issh-release.keystore"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-issh-android-sign-2026}"
          KS_ALIAS="${ANDROID_KEY_ALIAS:-issh}"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$KS_PATH" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ISSH, OU=Mobile, O=ISSH, L=Shanghai, S=Shanghai, C=CN"
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_RAW" "/tmp/issh-aligned.apk"
          OUT_APK="ISSH_${GITHUB_REF_NAME}_android_arm64.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_PASS" \
            --out "$OUT_APK" \
            "/tmp/issh-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT_APK"

          gh release upload "${GITHUB_REF_NAME}" "$OUT_APK" --clobber

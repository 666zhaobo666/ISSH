name: Release ISSH Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Build & sign Tauri Windows installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'ISSH ${{ github.ref_name }}'
          releaseBody: |
            ## ISSH ${{ github.ref_name }}

            - Windows 安装包（`.exe` / `.msi`）支持客户端内一键自动更新。
            - 详见提交记录。
          releaseDraft: false
          prerelease: false

  publish-android:
    needs: publish-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies & build core
        run: |
          npm install --no-audit --no-fund
          npm run build:core

      - name: Initialize & build Android APK (Tauri 2.0 Mobile)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          export NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" "ISSH_${GITHUB_REF_NAME}_android_arm64.apk"
          gh release upload "${GITHUB_REF_NAME}" "ISSH_${GITHUB_REF_NAME}_android_arm64.apk" --clobber
